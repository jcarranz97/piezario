# Example catalog for the test suite. This mirrors the shape of a real
# catalog.yaml and carries comments on purpose: the inventory-write tests
# assert that every one of these comments survives an edit.

models_dir: models
fonts_dir: fonts
icons_dir: icons
supply_images_dir: assets/supplies

# A folder with subfolders is a category; these are never content.
exclude:
  - node_modules
  - scratch

# Where generators drop their meshes — output, not a model of its own.
output_dirs:
  - out

# The landed-cost knobs (Print Farm Academy method).
cost:
  currency: "$"
  filament_per_kg: 20 # default spool price when a material has no own rate
  filament_per_kg_by_type:
    PLA: 18
    PETG: 25
  failure_risk:
    low: 1.1
    medium: 1.3
    high: 1.7
  printer_price: 500
  maintenance_cost: 100
  lifespan_hours: 5000
  power_watts: 120
  electricity_per_kwh: 0.15
  labor_per_hour: 20
  shipping_cost: 2
  tax_percent: 8
  markup_percent: 50

# Your spools. A model prices against one of these by id.
filaments:
  - id: pla-black
    name: PLA Basic Black
    material: PLA
    brand: Bambu Lab
    colors:
      - name: Black
        hex: "#000000"
    price_per_kg: 18
  - id: petg-clear
    name: PETG Clear
    material: PETG
    price_per_kg: 25

# Consumables that aren't printed. Three shapes on purpose: the two legacy flat
# ones (a bare `price:`, and `package_price` + `package_qty`), which must still
# read as a single purchase, and a real `purchases:` history.
supplies:
  - id: keyring
    name: Key ring 25mm
    unit: piece
    price: 0.1
    category: Hardware
    image: keyring.png
    url: https://www.amazon.com/dp/EXAMPLE
    # The older spelling of `description:`, still read.
    notes: Split rings, not solid ones.
  - id: jump-ring
    name: Jump ring 4mm
    unit: piece
    package_price: 5
    package_qty: 100
    category: Hardware
    # Not a link the UI may click: the reader drops any non-http(s) scheme
    # rather than render it as an href.
    url: "javascript:alert(1)"
  - id: washer
    name: Washer 6mm
    unit: piece
    category: Hardware
    description: Zinc-plated. The M6 ones, not M5.
    # $5 for 10 and $20 for 100 is $25 for 110 — 22.7c each. A plain average of
    # the two rates (50c and 20c) would say 35c, which is the bug this shape
    # exists to avoid.
    purchases:
      - date: "2026-07-01"
        url: https://shop.example.com/washers
        package_price: 5
        package_qty: 10
      - date: 2026-08-01
        package_price: 20
        package_qty: 100
        notes: Free postage over $15.
      # A one-off at a silly price, kept for the record but out of the average.
      - date: 2026-06-01
        package_price: 100
        package_qty: 1
        use_for_price: false
